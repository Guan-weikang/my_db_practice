services:
  postgres:
    image: postgres:17
    container_name: family-tree-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_tree_db}
      POSTGRES_USER: ${POSTGRES_USER:-family_tree_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family_tree_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-family_tree_user} -d ${POSTGRES_DB:-family_tree_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - family_tree_network

  redis:
    image: redis:7.4
    container_name: family-tree-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - family_tree_network

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: family-tree-backend
    environment:
      APP_NAME: ${APP_NAME:-Family Tree API}
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-family_tree_user}:${POSTGRES_PASSWORD:-family_tree_password}@postgres:5432/${POSTGRES_DB:-family_tree_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-access-secret}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-change-me-refresh-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost,http://127.0.0.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - family_tree_network

  stage7-import:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: family-tree-stage7-import
    profiles:
      - tools
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-family_tree_user}:${POSTGRES_PASSWORD:-family_tree_password}@postgres:5432/${POSTGRES_DB:-family_tree_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    working_dir: /workspace
    command: ["sh", "/workspace/scripts/stage7/reimport_generated.sh"]
    volumes:
      - .:/workspace
    networks:
      - family_tree_network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: family-tree-frontend
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - family_tree_network

  nginx:
    image: nginx:1.28-alpine
    container_name: family-tree-nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - family_tree_network

volumes:
  postgres_data:
  redis_data:

networks:
  family_tree_network:
    driver: bridge
